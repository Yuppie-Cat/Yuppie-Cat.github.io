  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:tomzhou@case.edu"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Yuppie-Cat"
    - label: "LinkedIn"
